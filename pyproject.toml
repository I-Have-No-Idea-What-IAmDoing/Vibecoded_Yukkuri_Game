[project]
name = "yukkuri-raising-game"
version = "0.1.0"
description = "A modern, data-driven reimagining of a Yukkuri Raising Game."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jules", email = "jules@example.com" },
]

dependencies = [
  "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
yukkuri-game = "game.adapters.pygame.__main__:main"

[project]
name = "yukkuri-raising-game"
version = "0.1.0"
description = "A modern reimagining of Yukkuri Hakkei"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4.0",
    "pygame-gui>=0.6.9",
    "numpy>=1.26.0",
    "loguru>=0.7.2",
    "pathfinding>=1.0.0",
    "py_trees>=2.2.3",
    "pymunk>=6.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yukkuri_game"]

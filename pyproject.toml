[project]
name = "yukkuri-raising-game"
version = "0.1.0"
description = "A modern reimagining of Yukkuri Hakkei"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4.0",
    "pygame-gui>=0.6.9",
    "numpy>=1.26.0",
    "loguru>=0.7.2",
    "pathfinding>=1.0.0",
    "py_trees>=2.2.3",
    "pymunk>=6.6.0",
    "esper>=3.0",
]

[dependency-groups.dev]
dependencies = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yukkuri_game"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Ignore missing imports for libraries without stubs
[[tool.mypy.overrides]]
module = [
    "pygame.*",
    "pygame_gui.*",
    "pymunk.*",
    "pathfinding.*",
    "py_trees.*",
    "loguru.*",
    "esper.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgspec"
ignore_missing_imports = true

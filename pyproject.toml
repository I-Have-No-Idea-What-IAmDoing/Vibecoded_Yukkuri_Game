[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yukkuri-raising-game"
version = "0.1.0"
description = "A modern reimagining of the classic fan game 'Yukkuri Hakkei'."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygame-ce",
    "pytest",
]

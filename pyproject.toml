[project]
name = "yukkuri-raising-game"
version = "0.1.0"
description = "A modern reimagining of Yukkuri Hakkei"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.6",
    "pygame-gui>=0.6.14",
    "numpy>=2.4.1",
    "loguru>=0.7.3",
    "py_trees>=2.4.0",
    "pymunk>=7.2.0",
    "esper>=3.4",
    "msgspec>=0.20.0",
    "simpleeval>=1.0.3",
    "pygame-render>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "psutil>=7.2.1",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yukkuri_game"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Ignore missing imports for libraries without stubs
[[tool.mypy.overrides]]
module = [
    "pygame.*",
    "pygame_gui.*",
    "pymunk.*",
    "pathfinding.*",
    "py_trees.*",
    "loguru.*",
    "esper.*",
    "pytest.*",
    "numpy.*",
    "pygame_light2d.*",
    "pygame_render.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgspec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ty.src]
exclude = ["**/tests/**", "**/docs/**"]

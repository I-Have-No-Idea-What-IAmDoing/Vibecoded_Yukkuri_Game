[actions.Eat]
weight = 2.0
[actions.Eat.effects]
type = "interact_item"
target_stat = "nutrition"
consume = true
stat_changes = { hunger = -20.0, happiness = 5.0 }

[[actions.Eat.considerations]]
name = "Hunger"
input = "hunger"
curve = "linear"
params = { m = 1.0, b = 0.0 }

# Predators prefer hunting over eating regular food
# This returns 0.0 if predator with prey nearby, 1.0 otherwise
[[actions.Eat.considerations]]
name = "NotHunting"
input = "is_predator"
curve = "inverse_linear"
# is_predator=1 -> 0.01 normalized -> score=0.99 (still allows eating if no prey)
# But combined with HasPrey in Hunt, predators should prefer Hunt

[actions.Sleep]
weight = 1.5
[actions.Sleep.effects]
type = "interact_item"
target_stat = "comfort"
consume = false
stat_changes = { energy = 10.0 } # Per second? Or one shot? Let's assume per second while doing it.

[[actions.Sleep.considerations]]
name = "Tiredness"
input = "energy_inv"
curve = "logit"
params = { k = 10.0, x0 = 0.7 }

[[actions.Sleep.considerations]]
name = "NightTime"
input = "is_night"
curve = "threshold"
params = { threshold = 0.005 }  # is_night = 1.0 -> 0.01 after normalization


# Predator-specific hunting action
[actions.Hunt]
weight = 3.0
[actions.Hunt.effects]
type = "hunt_prey"
target_stat = "hunger"
consume = false  # Prey entity is consumed via EatPrey action
stat_changes = { hunger = -50.0, happiness = 10.0 }

[[actions.Hunt.considerations]]
name = "Hunger"
input = "hunger"
curve = "logit"
params = { k = 10.0, x0 = 0.6 }  # Triggers strongly when hunger > 60

[[actions.Hunt.considerations]]
name = "HasPrey"
input = "nearby_prey"  # Checks specifically for prey count
curve = "threshold"
params = { threshold = 0.01 }  # At least 1 prey nearby

[[actions.Hunt.considerations]]
name = "IsPredator"
input = "is_predator"  # Only predators can hunt
curve = "threshold"
params = { threshold = 0.005 }  # is_predator = 1.0 -> 0.01 after normalization



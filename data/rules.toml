[stat_decay]
# Decay rates are per GAME SECOND (not physics second)
# With 60x time scale: 1 physics second = 60 game seconds
# Target: 3 meals/day = 100 hunger over ~8 hours (28800 game seconds)
hunger = 0.0035          # ~100 over 8 hours (was 2.0)
happiness = 0.002        # Slower decay (was 0.5)
stress = 0.02            # Slower decay to make stress and light sources meaningful (was 0.1)
energy = 0.002           # ~100 over ~14 hours (was 0.5)
cleanliness = 0.0015     # Slightly faster decay (was 0.001)
social = 0.002           # ~100 over ~14 hours (was 0.5)
age = 0.001              # 1 age unit per 1000 game seconds (was 1.0)
starvation_damage = 0.003 # Slow health loss when starving (was 0.02)
personality_drift_rate = 0.0001  # Very slow drift (was 0.1)
tastebud_decay = 0.001

[lifecycle]
baby_age_threshold = 100.0
child_age_threshold = 300.0
breeding_happiness_threshold = 80.0
breeding_energy_threshold = 80.0
breeding_cost = 50.0
breeding_chance = 0.001

[social]
memory_importance_threshold = 50.0
max_gossip_length = 10
witness_threshold = 5.0

[skills]
xp_base = 100.0
xp_exponent = 1.5

[stats]
badge_value = 500
health_deficit_penalty = 2.0
age_value_bonus = 0.2   # Scaled down to prevent immediate flipping exploits (was 10.0)
intelligence_base = 0.5


name: CI

on:
  push:
    branches: ["MVP"]
  pull_request:
    branches: ["MVP"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libsdl2-gfx-dev \
            libffi-dev \
            libgl1 \
            libglx-mesa0 \
            libgles2-mesa-dev \
            libegl1-mesa-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run Linters
        run: uv run scripts/lint.py

      - name: Run Tests
        env:
          SDL_VIDEODRIVER: dummy
        run: uv run scripts/test.py -x --timeout=10 -q
